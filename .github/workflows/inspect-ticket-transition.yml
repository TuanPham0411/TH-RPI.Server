name: Inspect Ticket transition
on:
  push:
    paths: ['.github/workflows/inspect-ticket-transition.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Read transition checkpoints without row contents
        run: |
          python3 - <<'PY'
          import pathlib,json
          stage=pathlib.Path.home()/'th-platform/state/ticket-transition'
          result={name:(stage/name).exists() for name in ['expected-rows.json','drive-source.json','drive-changing.json','drive-verified.json','completed.json']}
          if result['drive-source.json']:result['operations']=len(json.loads((stage/'drive-source.json').read_text())['packets'])
          print(json.dumps(result))
          PY
          docker ps -a --format '{{.Names}} {{.Status}}'
