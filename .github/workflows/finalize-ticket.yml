name: Finalize verified Ticket migration
on:
  push:
    paths: ['.github/workflows/finalize-ticket.yml']
permissions: {contents: read}
jobs:
  finalize:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Record verified recovery and prepare the cleanup command
        run: |
          set -eu
          umask 077
          OPERATOR="$HOME/th-platform/operator"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/TuanPham0411/TH-RPI.Server/18df18094e3f05b7fe8290084518dc4be458b8a7/deploy/ticket-cleanup.py -o "$OPERATOR/ticket-cleanup.py"
          python3 -m py_compile "$OPERATOR/ticket-cleanup.py"
          python3 - <<'PY'
          import pathlib,json,urllib.request,urllib.parse,re,subprocess,datetime,os
          home=pathlib.Path.home()/'th-platform'
          state_path=home/'state/ticket-deployment.json'
          state=json.loads(state_path.read_text())
          result=json.loads((home/'state/ticket-recovery-verification.json').read_text())
          assert result['release']==state['imageTag']
          assert all(result.get(k) for k in ['restoredFromDrive','foreignKeysVerified','mediaChecksumsVerified','productionUnchanged','exactRowsCompared'])
          for url in ['https://ticket.th.io.vn/api/health','https://th.io.vn/api/health','https://ai.th.io.vn/api/ready']:
              with urllib.request.urlopen(url,timeout=30) as response:assert response.status==200
          with urllib.request.urlopen('https://ticket.th.io.vn/',timeout=30) as response:html=response.read().decode()
          assert '<title>TH.Ticket</title>' in html
          old=json.loads((home/'state/ticket-transition/completed.json').read_text())['oldApplication'].split('-')[0]
          pattern=re.compile(r'(?<![A-Za-z0-9])'+re.escape(old)+r'(?![A-Za-z0-9])',re.I)
          assert not pattern.search(html)
          for asset in re.findall(r'src="([^\"]+\.js)"',html):
              with urllib.request.urlopen(urllib.parse.urljoin('https://ticket.th.io.vn/',asset),timeout=30) as response:script=response.read().decode()
              assert '/api/'+old+'/' not in script
          query='SELECT data::text FROM ticket_private.records'
          rows=subprocess.run(['docker','exec','ticket-database-1','psql','-X','-U','postgres','-d','ticket','-At','-c',query],capture_output=True,text=True,check=True)
          private=re.compile(r'password|secret|token|hash|digest|verifier|salt',re.I)
          def references(value,key=''):
              if isinstance(value,dict):return sum(references(v,k) for k,v in value.items())
              if isinstance(value,list):return sum(references(v,key) for v in value)
              return int(isinstance(value,str) and not private.search(key) and bool(pattern.search(value)))
          legacy=sum(references(json.loads(line)) for line in rows.stdout.splitlines())
          assert legacy==0,'Visible Ticket records still contain a retired product label'
          proof={**result,'imageTag':state['imageTag'],'publicRoutesVerified':True,'ticketBrandingVerified':True,'retiredVisibleLabels':legacy}
          (home/'state/ticket-recovery-verified.json').write_text(json.dumps(proof))
          backup=home/'state/backups/ticket'/datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          backup.mkdir(parents=True,exist_ok=True,mode=0o700)
          with (backup/'database.dump').open('wb') as output:
              subprocess.run(['docker','exec','ticket-database-1','pg_dump','-U','postgres','-Fc','ticket'],stdout=output,stderr=subprocess.PIPE,check=True)
          assert (backup/'database.dump').stat().st_size>32
          state['backup']=str(backup)
          temporary=state_path.with_suffix('.tmp');temporary.write_text(json.dumps(state));temporary.replace(state_path)
          print(json.dumps(proof))
          PY
          python3 "$OPERATOR/ticket-cleanup.py"
