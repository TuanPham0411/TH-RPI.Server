name: Inspect AI deployment and domain prerequisites
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [th-server-1, th-server-2]
        default: th-server-2
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ["${{ inputs.target == 'th-server-2' && 'th-server-2' || 'th-server-bootstrap' }}"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: Read only sanitized deployment metadata
        env:
          TARGET_RUNNER: ${{ inputs.target }}
          SELECTED_RUNNER: ${{ runner.name }}
        run: |
          set -euo pipefail
          test "$SELECTED_RUNNER" = "$TARGET_RUNNER"
          docker run --rm --network none --read-only --user 0 --cap-drop ALL --cap-add DAC_OVERRIDE --mount type=bind,src=/,dst=/host,readonly --mount "type=bind,src=$GITHUB_WORKSPACE/deploy/ai-domain-preflight.py,dst=/inspect.py,readonly" --entrypoint python3 ghcr.io/tuanpham0411/th-rpi-console:0dab2b0a6e61b26c9fb345d89503ac57f1301597 /inspect.py
          docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}'
          docker volume ls --format '{{.Name}}'
          ss -ltn '( sport = :80 or sport = :5000 or sport = :5050 or sport = :8081 or sport = :3100 )'
          systemctl is-active ssh NetworkManager tailscaled cloudflared docker
