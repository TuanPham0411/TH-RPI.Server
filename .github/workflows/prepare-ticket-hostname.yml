name: Prepare TH.Ticket hostname
on:
  push:
    paths: ['.github/workflows/prepare-ticket-hostname.yml']
permissions: {contents: read}
jobs:
  prepare:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Prepare server-managed hostname configuration
        run: |
          set -eu
          umask 077
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          for file in ticket-cutover.py ticket-nginx.conf; do
            curl -fsSL --retry 3 https://raw.githubusercontent.com/TuanPham0411/TH-RPI.Server/7c47a6b2c989b876d4c8afe1050fed5300755848/deploy/$file -o "$WORK/$file"
          done
          python3 "$WORK/ticket-cutover.py"
          if sudo -n true 2>/dev/null; then
            python3 "$WORK/ticket-cutover.py" --apply
          else
            echo 'Nginx configuration prepared; host sudo authentication is required to install it.'
          fi
