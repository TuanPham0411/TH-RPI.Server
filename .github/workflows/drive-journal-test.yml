name: Test Drive journal
on:
  push:
    branches: [storage/drive-journal]
  pull_request:
    paths: ['storage/drive-journal/**', '.github/workflows/drive-journal-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check storage/drive-journal/google-drive.mjs
      - run: node --test storage/drive-journal/store.test.mjs
