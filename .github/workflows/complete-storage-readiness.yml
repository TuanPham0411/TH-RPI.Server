name: Complete storage readiness
on:
  push:
    paths: ['.github/workflows/complete-storage-readiness.yml']
permissions: {contents: read}
jobs:
  complete:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    steps:
      - name: Complete the existing storage release with a longer readiness window
        run: |
          set -eu
          umask 077
          SOURCE="$(mktemp -d)"
          trap 'rm -rf "$SOURCE"' EXIT
          mkdir -p "$SOURCE/deploy"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/TuanPham0411/TH-RPI.Server/34748d21ac61ea63e39eb189cb14dd2a81dee54c/compose.yaml -o "$SOURCE/compose.yaml"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/TuanPham0411/TH-RPI.Server/34748d21ac61ea63e39eb189cb14dd2a81dee54c/deploy/bootstrap.py -o "$SOURCE/deploy/bootstrap.py"
          sed -i 's/range(45)/range(300)/' "$SOURCE/deploy/bootstrap.py"
          python3 "$SOURCE/deploy/bootstrap.py" --image-tag 34748d21ac61ea63e39eb189cb14dd2a81dee54c
