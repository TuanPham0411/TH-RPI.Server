name: Retire superseded rollout checks
on:
  push:
    branches: [main]
    paths: [.github/workflows/retire-superseded.yml]
permissions: {actions: write, contents: read}
jobs:
  retire:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete checks so current deployments can proceed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import os,urllib.request,urllib.error
          for run in [40733787835,40733787875,40734278339,40734415296,40734847590]:
              request=urllib.request.Request(f'https://api.github.com/repos/TuanPham0411/TH-RPI.Server/actions/runs/{run}/cancel',method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:print(f'Obsolete run {run}: cancellation requested ({response.status})')
              except urllib.error.HTTPError as error:
                  if error.code!=409:raise
                  print(f'Obsolete run {run}: already completed')
          PYTHON
