name: Complete application cutovers
on:
  push:
    branches: [main]
    paths: [.github/workflows/complete-cutover.yml]
  workflow_dispatch:
permissions: {contents: read, packages: read}
jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    env:
      DOCKER_CONFIG: /tmp/th-cutover-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - run: test "$SELECTED_RUNNER" = th-server
        env: {SELECTED_RUNNER: '${{ runner.name }}'}
      - uses: actions/checkout@v5
        with: {persist-credentials: false, path: platform}
      - uses: actions/checkout@v5
        with:
          repository: TuanPham0411/TH-Portfolio
          ref: 0b60ded4e91c11a3b048a6814b01f3fb2a58ef82
          path: portfolio
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: TuanPham0411/TH-MES.Ticket
          ref: 42b31c87df5a940d8987a63b7900e70b5ae5b3e1
          path: mes-ticket
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy verified images with preserved environment
        run: |
          python3 platform/deploy/application.py --application portfolio --image-tag 0b60ded4e91c11a3b048a6814b01f3fb2a58ef82 --source portfolio
          python3 platform/deploy/application.py --application mes-ticket --image-tag 42b31c87df5a940d8987a63b7900e70b5ae5b3e1 --source mes-ticket
