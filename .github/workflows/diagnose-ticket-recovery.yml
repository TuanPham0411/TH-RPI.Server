name: Diagnose Ticket recovery
on:
  push:
    paths: ['.github/workflows/diagnose-ticket-recovery.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    steps:
      - name: Restore an isolated Ticket database with redacted diagnostics
        run: |
          set -eu
          umask 077
          SOURCE="$(mktemp)"
          trap 'rm -f "$SOURCE" "$HOME/th-platform/run/maintenance-ticket"' EXIT
          curl -fsSL --retry 3 https://raw.githubusercontent.com/TuanPham0411/TH-RPI.Server/81688886e5e513f1dcb0311315cab23ecda2ef6d/deploy/ticket-debug-recovery.py -o "$SOURCE"
          printf '%s\n' 'Ticket recovery verification in progress' > "$HOME/th-platform/run/maintenance-ticket"
          python3 "$SOURCE" --application ticket
