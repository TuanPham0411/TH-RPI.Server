name: Inspect AI workflow host capacity
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-n8n-host.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Read host resources and existing application readiness
        run: |
          test "${{ runner.name }}" = th-server
          free -h
          df -h /
          docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} Memory={{.MemUsage}}'
          docker system df
          systemctl show th-server-console.service --property=ActiveState,SubState,NRestarts
          for pair in '8080 th.io.vn health' '8081 ai.th.io.vn ready' '8082 ticket.th.io.vn health'; do
            read -r port host endpoint <<< "$pair"
            curl --fail --silent --show-error --max-time 10 -H "Host: $host" "http://127.0.0.1:$port/api/$endpoint"
          done
