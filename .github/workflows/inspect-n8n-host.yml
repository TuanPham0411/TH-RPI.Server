name: Inspect AI workflow host capacity
on:
  push:
    branches: [main]
    paths: [.github/workflows/inspect-n8n-host.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Read host resources and existing application readiness
        run: |
          test "${{ runner.name }}" = th-server
          free -h
          df -h /
          docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} Memory={{.MemUsage}}'
          docker system df
          systemctl show th-server-console.service --property=ActiveState,SubState,NRestarts
          for pair in '8080 th.io.vn health' '8081 ai.th.io.vn ready' '8082 ticket.th.io.vn health'; do
            read -r port host endpoint <<< "$pair"
            curl --fail --silent --show-error --max-time 10 -H "Host: $host" "http://127.0.0.1:$port/api/$endpoint"
          done
          docker ps -a --format '{{.Names}} {{.Status}}'
          cat /proc/swaps
          python3 - <<'PY'
          import pathlib,json
          home=pathlib.Path.home()/'th-platform'
          for name in ['n8n-deployment.json','n8n-backup.json']:
              path=home/'state'/name
              if path.exists():
                  data=json.loads(path.read_text());print(name,json.dumps({k:data.get(k) for k in ['ready','version','workflowId','verified','restoreVerified']}))
          PY
          curl --silent --max-time 3 --output /dev/null --write-out 'Staging n8n HTTP %{http_code}\n' http://127.0.0.1:8083/api/ready || true
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'n8n|console'
          for name in th-n8n-n8n-1 th-n8n-gateway-1; do
            docker inspect "$name" --format '{{.Name}} {{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' || true
            docker logs --tail 30 "$name" 2>&1 || true
          done
          find ~/actions-runners -path '*/_diag/Worker_*.log' -mmin -100 -type f -print | tail -5
