name: Test and package server console
on:
  push:
    branches: [main]
    paths: ['console/**', 'Dockerfile.console', '.github/workflows/console.yml']
  pull_request:
    paths: ['console/**', 'Dockerfile.console', '.github/workflows/console.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: console-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s console -p 'test_*.py' -v
      - run: python3 -m py_compile console/*.py
      - run: bash -n console/setup.sh
      - name: Build and smoke test distribution without host access
        run: |
          docker build -f Dockerfile.console -t th-console:test .
          TH_CONSOLE_DOCKER_TEST=1 python3 -m unittest discover -s console -p 'test_docker_live.py' -v
          docker run --rm --network none th-console:test > /tmp/console-snapshot.json
          python3 - <<'PY'
          import json
          value=json.load(open('/tmp/console-snapshot.json'))
          assert value['hostname'] and 'inventory' in value
          assert 'containers' in value['inventory']['errors']
          assert 'services' in value['inventory']['errors']
          PY
  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.console
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tuanpham0411/th-rpi-console:${{ github.sha }}
            ghcr.io/tuanpham0411/th-rpi-console:latest
          labels: org.opencontainers.image.source=https://github.com/TuanPham0411/TH-RPI.Server
