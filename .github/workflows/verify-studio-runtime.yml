name: Verify deployed Studio runtime
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-studio-runtime.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 12
    steps:
      - name: Confirm final release, scheduler heartbeat and retired n8n
        run: |
          test '${{ runner.name }}' = th-server
          python3 - <<'PY'
          import pathlib,json,time,subprocess
          home=pathlib.Path.home()/'th-platform'
          expected='6dc9de190708fe87442f0ded113625248bed5a7f'
          for attempt in range(60):
              path=home/'state/ai-agent-deployment.json'
              data=json.loads(path.read_text()) if path.exists() else {}
              if data.get('ready') and data.get('imageTag')==expected:break
              time.sleep(10)
          else:raise SystemExit('Final Studio release not recorded')
          print(json.dumps({'studioReady':True,'imageTag':data['imageTag'],'driveFirst':data['driveFirst']}))
          for attempt in range(15):
              path=home/'state/automation-heartbeat.json'
              heartbeat=json.loads(path.read_text()) if path.exists() else {}
              if heartbeat.get('active') and time.time()-heartbeat.get('lastTick',0)<180:break
              time.sleep(5)
          else:raise SystemExit('Scheduler heartbeat is not current')
          print(json.dumps({'schedulerHeartbeatVerified':True,'protocol':heartbeat['protocol']}))
          result=subprocess.check_output(['systemctl','show','th-automation.service','--property=ExecStopPost'],text=True)
          assert '--cleanup' in result
          print(json.dumps({'supervisorShutdownCleanupConfigured':True}))
          for name in ['th-n8n-n8n-1','th-n8n-gateway-1']:
              running=subprocess.check_output(['docker','inspect',name,'--format','{{.State.Running}}'],text=True).strip()
              assert running=='false'
          print(json.dumps({'n8nStopped':True}))
          PY
          systemctl is-active th-automation.service
          systemctl show th-server-console.service --property=ActiveState,NRestarts
          free -h
          docker ps --format '{{.Names}} {{.Status}}'
          curl --fail --silent --show-error --max-time 30 https://ai.th.io.vn/api/ready
          curl --fail --silent --show-error --max-time 30 https://th.io.vn/api/health
          curl --fail --silent --show-error --max-time 30 https://ticket.th.io.vn/api/health
