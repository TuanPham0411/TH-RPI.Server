name: Update managed Portfolio
on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full SHA of a tested and published Portfolio image
        required: true
        type: string
permissions: {contents: read, packages: read}
concurrency: {group: portfolio-recovery-th-server-1, cancel-in-progress: false}
jobs:
  update:
    runs-on: [th-server-bootstrap]
    timeout-minutes: 30
    env:
      DOCKER_CONFIG: /tmp/th-portfolio-update-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Portfolio with retained data and configuration
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          SELECTED_RUNNER: ${{ runner.name }}
        run: |
          set -euo pipefail
          test "$SELECTED_RUNNER" = th-server-1
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          source_dir="$(mktemp -d "$RUNNER_TEMP/portfolio-source.XXXXXX")"
          trap 'rm -rf "$source_dir"' EXIT
          for file in compose.yaml storage.compose.yaml database-init.sh; do
            curl --fail --silent --show-error --location --retry 3 --max-time 60 "https://raw.githubusercontent.com/TuanPham0411/TH-Portfolio/$IMAGE_SHA/$file" -o "$source_dir/$file"
          done
          python3 deploy/application.py --application portfolio --image-tag "$IMAGE_SHA" --source "$source_dir"
      - name: Verify browser OAuth navigation and origin protection
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Site: cross-site' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' https://th.io.vn/api/oauth/start)"
          test "$status" = 302
          status="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Site: cross-site' -H 'Sec-Fetch-Mode: cors' -H 'Sec-Fetch-Dest: empty' https://th.io.vn/api/oauth/start)"
          test "$status" = 403
          curl --fail --silent --show-error --max-time 30 https://th.io.vn/api/health
      - name: Verify independent services
        if: always()
        run: |
          systemctl is-active th-server-monitor.service th-server-console.service ssh NetworkManager tailscaled cloudflared nginx
          curl --fail --silent --show-error --max-time 30 https://esp.th.io.vn/healthz
          curl --fail --silent --show-error --max-time 30 https://got.th.io.vn/healthz
