name: Deploy ESP32 with management runner
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the tested ESP32 image and enable the public route
        type: boolean
        default: false
      image_sha:
        description: Immutable published TH-ESP32 image/source SHA
        type: string
        default: 080cddfcbef05a2233834ce06103341afe0aaf6d
permissions: {contents: read, packages: read}
concurrency: {group: esp32-th-server-1, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: [th-server-bootstrap]
    timeout-minutes: 15
    env:
      DOCKER_CONFIG: /tmp/th-esp32-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: docker/login-action@v3
        if: inputs.deploy == true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect ESP32 deployment prerequisites
        env:
          SELECTED_RUNNER: ${{ runner.name }}
        run: |
          test "$SELECTED_RUNNER" = th-server-1
          python3 -m unittest discover -s tests -p 'test_esp32_deploy.py' -v
          python3 deploy/esp32-deploy.py
      - name: Deploy and verify ESP32
        if: inputs.deploy == true
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: python3 deploy/esp32-deploy.py --deploy --image-sha "$IMAGE_SHA"
      - name: Verify existing services
        if: always()
        run: |
          systemctl is-active th-server-monitor.service th-server-console.service ssh NetworkManager tailscaled cloudflared nginx
          curl --fail --silent --show-error --max-time 20 https://th.io.vn/api/health
