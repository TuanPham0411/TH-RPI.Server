name: Inspect rollout progress
on:
  push:
    branches: [main]
    paths: [.github/workflows/rollout-progress.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Read rollout state without credentials
        run: |
          python3 - <<'PYTHON'
          import pathlib,json,subprocess,os,fcntl
          home=pathlib.Path.home()/'th-platform'
          subprocess.run(['docker','ps','-a','--format','{{.Names}} | {{.Status}} | {{.Image}}'],check=True)
          lock=open(home/'deploy.lock','a')
          try:
              fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB);locked=False
              fcntl.flock(lock,fcntl.LOCK_UN)
          except BlockingIOError:locked=True
          print(json.dumps({'deploymentLockHeld':locked}),flush=True)
          for app in ['ai-agent','portfolio','mes-ticket']:
              release=home/'apps'/app/'releases'
              backup=home/'state/backups'/app
              print(json.dumps({'application':app,'releases':[p.name for p in release.glob('*')] if release.exists() else [],'backups':[p.name for p in backup.glob('*')] if backup.exists() else [],'maintenance':(home/'run'/('maintenance-'+app)).exists()}),flush=True)
          inode=str(os.stat(home/'deploy.lock').st_ino)
          for line in pathlib.Path('/proc/locks').read_text().splitlines():
              fields=line.split()
              if any(value.endswith(':'+inode) for value in fields):
                  print('Lock record: '+line)
          PYTHON
