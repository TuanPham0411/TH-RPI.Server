name: Verify live storage deployment
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Verify management runner
        env: {SELECTED_RUNNER: '${{ runner.name }}'}
        run: test "$SELECTED_RUNNER" = th-server
      - name: Verify application modes and runtime-role Drive commits
        run: |
          python3 - <<'PYTHON'
          import json,pathlib,subprocess,urllib.request
          home=pathlib.Path.home()/'th-platform'
          apps=[
            ('ai-agent','ai-agent-api-1','server/storage-operator.js','https://ai.th.io.vn/api/ready'),
            ('portfolio','portfolio-portfolio-1','dist/server/storage-operator.cjs','https://th.io.vn/'),
            ('mes-ticket','mes-ticket-mes-1','dist/server/storage-operator.cjs','https://mes.th.io.vn/')]
          incomplete=[]
          for app,container,operator,url in apps:
              info=json.loads(subprocess.check_output(['docker','inspect',container],text=True))[0]
              env=dict(v.split('=',1) for v in info['Config']['Env'] if '=' in v)
              state=info['State']
              ready=state['Running'] and state.get('Health',{}).get('Status','healthy')=='healthy'
              managed=env.get('TH_STORAGE_MODE')=='drive-first'
              print(json.dumps({'application':app,'running':bool(ready),'driveFirst':managed,'image':info['Config']['Image']}),flush=True)
              if not ready or not managed or not (home/'state'/(app+'-deployment.json')).exists():incomplete.append(app)
          if incomplete:raise SystemExit('Application cutovers not complete: '+', '.join(incomplete))
          for app,container,operator,url in apps:
              result=subprocess.run(['docker','exec',container,'node',operator,'probe'],capture_output=True,text=True)
              if result.returncode:raise SystemExit('Runtime-role Drive verification failed for '+app+': '+result.stderr[-500:])
              proof=json.loads(result.stdout.strip())
              if proof.get('driveFirstVerified') is not True:raise SystemExit('Drive proof missing')
              with urllib.request.urlopen(url,timeout=30) as response:
                  if response.status!=200:raise SystemExit('Public route failed')
              print(json.dumps({'application':app,'publicHTTP':200,**proof}),flush=True)
          print(json.dumps({'driveRoot':json.loads((home/'state/drive-root.json').read_text())['folderId'],'allApplicationsVerified':True}))
          PYTHON
