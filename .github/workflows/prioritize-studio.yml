name: Prioritize Studio deployment over scheduled recovery verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/prioritize-studio.yml]
permissions: {contents: read}
jobs:
  defer-scheduled-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {contents: read, actions: write}
    steps:
      - name: Defer only the identified scheduled scratch-database recovery drill
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const url='https://api.github.com/repos/TuanPham0411/TH-RPI.Server/actions/runs/40976581519';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          let r=await fetch(url,{headers});assert.equal(r.status,200);let run=await r.json();
          assert.equal(run.event,'schedule');assert.equal(run.name,'Verify recovery from Drive');assert.equal(run.path,'.github/workflows/recovery-drill.yml');
          if(run.status!=='completed'){r=await fetch(url+'/cancel',{method:'POST',headers});assert([202,409].includes(r.status));}
          for(let attempt=0;attempt<60;attempt++){r=await fetch(url,{headers});assert.equal(r.status,200);run=await r.json();if(run.status==='completed'){console.log(JSON.stringify({scheduledScratchDrillStopped:true,conclusion:run.conclusion,productionDatabasesUnchanged:true}));process.exit(0);}await new Promise(resolve=>setTimeout(resolve,5000));}
          throw Error('Scheduled recovery drill has not stopped; no production operation was cancelled.');
          JS
  cleanup-scratch-only:
    needs: defer-scheduled-drill
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    steps:
      - name: Remove only abandoned recovery containers and scratch databases
        env:
          SELECTED_RUNNER: '${{ runner.name }}'
        run: |
          test "$SELECTED_RUNNER" = th-server
          python3 - <<'PY'
          import subprocess,json,urllib.parse,re,pathlib,fcntl
          def command(args):return subprocess.run(args,capture_output=True,text=True,check=True,timeout=45).stdout
          pattern=re.compile(r'^th_recovery_(?:ai_agent|portfolio|ticket)_\d{14}$')
          lock=open(pathlib.Path.home()/'th-platform/deploy.lock','a');fcntl.flock(lock,fcntl.LOCK_EX)
          # Docker inspection is captured privately; connection URLs are never printed.
          ids=command(['docker','ps','-aq','--filter','label=com.docker.compose.service=migrate']).split()
          removed=0
          for identifier in ids:
           if not re.fullmatch('[a-f0-9]{12,64}',identifier):continue
           data=json.loads(command(['docker','inspect',identifier]))[0]
           environment=dict(line.split('=',1) for line in data['Config']['Env'] if '=' in line)
           database=urllib.parse.urlparse(environment.get('DATABASE_URL','')).path.lstrip('/')
           if pattern.fullmatch(database):command(['docker','rm','-f',identifier]);removed+=1
          dropped=0
          for container in ['ai-agent-db-1','portfolio-database-1','ticket-database-1']:
           names=command(['docker','exec',container,'psql','-X','-U','postgres','-d','postgres','-At','-c',"SELECT datname FROM pg_database WHERE datname LIKE 'th_recovery_%'"]).splitlines()
           for name in names:
            if pattern.fullmatch(name):command(['docker','exec',container,'dropdb','-U','postgres','--if-exists','--force',name]);dropped+=1
          print(json.dumps({'scratchContainersRemoved':removed,'scratchDatabasesRemoved':dropped,'productionDatabasesUnchanged':True}))
          PY
