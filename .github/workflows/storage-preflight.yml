name: Storage migration preflight
on:
  push:
    branches: [main]
    paths: [.github/workflows/storage-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Verify management runner
        env:
          SELECTED_RUNNER: ${{ runner.name }}
        run: test "$SELECTED_RUNNER" = th-server
      - name: Deployment permissions and volumes
        run: |
          set -eu
          id -un
          free -m
          docker_cmd=(docker)
          if docker ps --format '{{.ID}}' >/dev/null 2>&1; then
            :
          elif sudo -n docker ps --format '{{.ID}}' >/dev/null; then
            docker_cmd=(sudo -n docker)
          else
            echo '::error::Management runner cannot administer Docker without an interactive sudo password.'
            exit 1
          fi
          "${docker_cmd[@]}" info --format 'Docker={{.ServerVersion}} Architecture={{.Architecture}}'
          for container in ai-agent-api-1 portfolio-portfolio-1 mes-ticket-mes-1; do
            "${docker_cmd[@]}" inspect --format '{{.Name}} image={{.Config.Image}} running={{.State.Running}}{{range .Mounts}} mount={{.Name}}:{{.Destination}}:rw={{.RW}}{{end}}' "$container"
          done
          "${docker_cmd[@]}" exec mes-ticket-mes-1 node -e 'const fs=require("node:fs");const p=process.env.DRIVE_TOKEN_FILE;let c;try{c=JSON.parse(fs.readFileSync(p,"utf8"))}catch{}console.log(JSON.stringify({driveCredentialsReadable:!!c,offlineAccess:!!c?.refreshToken,oauthClientConfigured:!!((process.env.GOOGLE_DRIVE_CLIENT_ID||process.env.GOOGLE_CLIENT_ID)&&(process.env.GOOGLE_DRIVE_CLIENT_SECRET||process.env.GOOGLE_CLIENT_SECRET))}));if(!c?.refreshToken)process.exit(1)'
