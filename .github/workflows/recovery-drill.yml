name: Verify recovery from Drive
on:
  push:
    branches: [main]
    paths: [.github/workflows/recovery-drill.yml]
  workflow_dispatch:
  schedule:
    - cron: '20 20 * * *'
permissions: {contents: read, packages: read}
concurrency:
  group: recovery-drill
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    env:
      DOCKER_CONFIG: /tmp/th-recovery-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - run: test "$SELECTED_RUNNER" = th-server
        env: {SELECTED_RUNNER: '${{ runner.name }}'}
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore into disposable databases and compare rows
        run: |
          python3 deploy/snapshot.py
          python3 deploy/recovery-drill.py
