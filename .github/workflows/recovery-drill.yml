name: Verify recovery from Drive
on:
  push:
    branches: [main]
    paths: [.github/workflows/recovery-drill.yml]
  workflow_dispatch:
  schedule:
    - cron: '20 20 * * *'
permissions: {contents: read}
concurrency:
  group: recovery-drill
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    steps:
      - name: Restore remote schema, JSON data and referenced files
        env:
          SELECTED_RUNNER: '${{ runner.name }}'
          SOURCE_SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          test "$SELECTED_RUNNER" = th-server
          umask 077
          tools_dir="$(mktemp -d "$RUNNER_TEMP/th-recovery.XXXXXX")"
          trap 'rm -rf "$tools_dir"' EXIT
          for script in snapshot.py recovery-drill.py; do
            curl --fail --silent --show-error --location --retry 3 --max-time 60 "https://raw.githubusercontent.com/TuanPham0411/TH-RPI.Server/$SOURCE_SHA/deploy/$script" -o "$tools_dir/$script"
          done
          python3 "$tools_dir/snapshot.py"
          python3 "$tools_dir/recovery-drill.py"
