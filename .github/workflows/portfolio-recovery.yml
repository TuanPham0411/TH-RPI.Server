name: Recover Portfolio from retained Drive storage
on:
  workflow_dispatch:
    inputs:
      diagnose:
        description: Run read-only diagnostics without reconnecting or restoring data
        type: boolean
        default: false
      restore:
        description: Restore existing Portfolio data and publish the verified site
        type: boolean
        default: false
permissions: {contents: read, packages: read}
concurrency:
  group: portfolio-recovery-th-server-1
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests -p 'test_portfolio_recovery.py' -v
  recover:
    needs: validate
    runs-on: [th-server-bootstrap]
    timeout-minutes: 40
    env:
      DOCKER_CONFIG: /tmp/th-portfolio-recovery-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check management runner
        env:
          SELECTED_RUNNER: ${{ runner.name }}
        run: test "$SELECTED_RUNNER" = th-server-1
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconnect storage and inspect recovery metadata
        if: inputs.diagnose != true
        env:
          RESTORE: ${{ inputs.restore }}
        run: |
          args=(--source "$GITHUB_WORKSPACE")
          if [ "$RESTORE" = true ]; then args+=(--restore); fi
          python3 deploy/portfolio-recovery.py "${args[@]}"
      - name: Verify management and access services
        run: |
          systemctl is-active th-server-monitor.service th-server-console.service ssh NetworkManager tailscaled cloudflared nginx
      - name: Safe recovery diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          result=subprocess.run(['docker','inspect','--format','{{json .State.Status}} {{.RestartCount}}','th-platform-storage-1'],capture_output=True,text=True)
          print(json.dumps({'brokerState':result.stdout.strip() if result.returncode==0 else 'unavailable'}))
          logs=subprocess.run(['docker','logs','--tail','60','th-platform-storage-1'],capture_output=True,text=True)
          text=logs.stdout+'\n'+logs.stderr
          patterns=[r'Drive OAuth refresh failed \(\d+\)',r'Drive request failed \(\d+\)',r'Drive owner or offline grant differs',r'Authenticated Drive owner differs',r'Missing or corrupt event',r'Unsupported state or unable to authenticate data',r'JavaScript heap out of memory']
          reasons=sorted(set(match.group(0) for pattern in patterns for match in re.finditer(pattern,text)))
          print(json.dumps({'recognizedBrokerErrors':reasons,'brokerReadyLog': 'TH storage ready' in text}))
          import importlib.util
          spec=importlib.util.spec_from_file_location('recovery',pathlib.Path('deploy/portfolio-recovery.py'))
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          sock=module.HOME/'run/storage.sock'
          try:
              info=sock.stat();print(json.dumps({'socketUid':info.st_uid,'socketMode':oct(info.st_mode & 0o777),'runnerUid':__import__('os').getuid()}))
              config=json.loads((module.HOME/'config/runtime.json').read_text())
              value=module.broker(config,'portfolio','/v1/status',{},timeout=5)
              print(json.dumps({'brokerStatusEndpoint':True,'connected':value.get('connected')}))
          except Exception as error:
              print(json.dumps({'brokerStatusEndpoint':False,'reason':str(error) if isinstance(error,RuntimeError) else type(error).__name__}))
          stats=subprocess.run(['docker','stats','--no-stream','--format','{{json .}}','th-platform-storage-1'],capture_output=True,text=True)
          if stats.returncode==0:
              row=json.loads(stats.stdout);print(json.dumps({'brokerResources':{key:row.get(key) for key in ('CPUPerc','MemUsage','NetIO','PIDs')}}))
          identity=subprocess.run(['docker','exec','th-platform-storage-1','id','-u'],capture_output=True,text=True)
          print(json.dumps({'brokerUid':identity.stdout.strip() if identity.returncode==0 else 'unavailable'}))
          for app in ('ai-agent','portfolio','ticket','server'):
              path=module.HOME/'state'/(app+'.json')
              try:
                  import time
                  cache=json.loads(path.read_text());files=cache.get('files',{})
                  print(json.dumps({'index':app,'ageSeconds':round(time.time()-path.stat().st_mtime),'files':len(files),'bytes':sum(int(value.get('size',0)) for value in files.values())}))
              except (OSError,ValueError,TypeError):print(json.dumps({'index':app,'readable':False}))
          mounts=subprocess.run(['docker','inspect','--format','{{json .Mounts}}','th-platform-storage-1'],capture_output=True,text=True)
          if mounts.returncode==0:
              print(json.dumps({'brokerMounts':[{'source':row['Source'],'destination':row['Destination']} for row in json.loads(mounts.stdout)]}))
          state=pathlib.Path.home()/'th-platform/state/portfolio-recovery'
          error_file=state/'last-command-error.log'
          if error_file.is_file():
              text=error_file.read_text(errors='replace')
              categories=['unauthorized','denied','manifest unknown','not found','invalid reference format','interpolat','permission','no such file','toomanyrequests','rate limit','error pulling','unable to get image','is a directory']
              print(json.dumps({'dockerErrorCategories':[key for key in categories if key in text.lower()]}))
              # Redact host-configured values before showing a bounded diagnostic.
              env_path=pathlib.Path.home()/'apps/portfolio/.env'
              values=module.read_environment(env_path) if env_path.is_file() else {}
              for value in sorted(values.values(),key=len,reverse=True):
                  if len(value)>=4:text=text.replace(value,'[REDACTED]')
              text=re.sub(r'(?i)Bearer\s+[^\s]+','Bearer [REDACTED]',text)
              text=re.sub(r'://[^/\s:@]+:[^/\s@]+@','://[REDACTED]@',text)
              print(json.dumps({'redactedDockerError':text[-2500:]}))
          image='ghcr.io/tuanpham0411/th-portfolio-app:be152df4054f8c88d15d2e960af4ef60f6f6c79b'
          cached=subprocess.run(['docker','image','inspect','--format','{{json .RepoDigests}}',image],capture_output=True,text=True)
          print(json.dumps({'cachedPortfolioImage':cached.returncode==0,'repoDigests':json.loads(cached.stdout) if cached.returncode==0 else []}))
          for name in ('definition.json','progress.json','last-command-error.log'):
              print(json.dumps({'privateRecoveryFile':name,'exists':(state/name).is_file()}))
          PY
