name: Recover Portfolio from retained Drive storage
on:
  workflow_dispatch:
    inputs:
      restore:
        description: Restore existing Portfolio data and publish the verified site
        type: boolean
        default: false
permissions: {contents: read, packages: read}
concurrency:
  group: portfolio-recovery-th-server-1
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s tests -p 'test_portfolio_recovery.py' -v
  recover:
    needs: validate
    runs-on: [th-server-bootstrap]
    timeout-minutes: 40
    env:
      DOCKER_CONFIG: /tmp/th-portfolio-recovery-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check management runner
        env:
          SELECTED_RUNNER: ${{ runner.name }}
        run: test "$SELECTED_RUNNER" = th-server-1
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconnect storage and inspect recovery metadata
        env:
          RESTORE: ${{ inputs.restore }}
        run: |
          args=(--source "$GITHUB_WORKSPACE")
          if [ "$RESTORE" = true ]; then args+=(--restore); fi
          python3 deploy/portfolio-recovery.py "${args[@]}"
      - name: Verify management and access services
        run: |
          systemctl is-active th-server-monitor.service th-server-console.service ssh NetworkManager tailscaled cloudflared nginx
      - name: Safe recovery diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          result=subprocess.run(['docker','inspect','--format','{{json .State.Status}} {{.RestartCount}}','th-platform-storage-1'],capture_output=True,text=True)
          print(json.dumps({'brokerState':result.stdout.strip() if result.returncode==0 else 'unavailable'}))
          logs=subprocess.run(['docker','logs','--tail','60','th-platform-storage-1'],capture_output=True,text=True)
          text=logs.stdout+'\n'+logs.stderr
          patterns=[r'Drive OAuth refresh failed \(\d+\)',r'Drive request failed \(\d+\)',r'Drive owner or offline grant differs',r'Authenticated Drive owner differs',r'Missing or corrupt event',r'Unsupported state or unable to authenticate data',r'JavaScript heap out of memory']
          reasons=sorted(set(match.group(0) for pattern in patterns for match in re.finditer(pattern,text)))
          print(json.dumps({'recognizedBrokerErrors':reasons}))
          state=pathlib.Path.home()/'th-platform/state/portfolio-recovery'
          for name in ('definition.json','progress.json','last-command-error.log'):
              print(json.dumps({'privateRecoveryFile':name,'exists':(state/name).is_file()}))
          PY
